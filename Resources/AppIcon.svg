<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="shell-gradient" x1="512" y1="300" x2="512" y2="738" gradientUnits="userSpaceOnUse">
      <stop stop-color="#212226"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="sparkle-gradient" x1="710" y1="404" x2="886" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#92e755"/>
      <stop offset="1" stop-color="#35b85f"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#f7f7f7"/>

  <!-- Crisp rounded-rectangle obsidian notch shell (rx = 160) with a tight camera cutout and 16-unit shoulder fillets. -->
  <rect id="notch-shell" x="64" y="300" width="896" height="438" rx="160" fill="url(#shell-gradient)"/>
  <path d="M396 300 Q410 300 414 316 C424 356 462 398 512 398 C562 398 600 356 610 316 Q614 300 628 300 Z" fill="#f7f7f7"/>

  <!-- Crisp white command prompt legible at Finder and sidebar sizes. -->
  <path id="prompt-mark" d="m264 454 88 74-88 74" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="30"/>
  <path d="M400 614h82" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="30"/>

  <!-- Four-point green spark centered inside the right notch lobe. -->
  <path id="sparkle" d="M790 410c14 62 42 90 104 104-62 14-90 42-104 104-14-62-42-90-104-104 62-14 90-42 104-104Z" fill="url(#sparkle-gradient)"/>
</svg>
