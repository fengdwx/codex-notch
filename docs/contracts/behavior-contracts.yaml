      - Tests/CodexNotchTests/SwordWandererBattleMotionTests.swift
      - Tests/CodexNotchTests/NotchPanelVisibilityPolicyTests.swift
      - Tests/CodexNotchTests/NotchRuntimePerformanceTests.swift
      - docs/decisions/016-sword-wanderer-battle-island.md
      - docs/decisions/017-mirrored-display-menu-bar-fallback.md
      - "manual: launch the built app on a no-notch Mac, confirm the original Sword Wanderer identity, repeated jumping slimes, visible sword contact and +1 overlap with the next spawn, menu-bar containment, downward hover expansion, collapse reclamation, and a static Reduce Motion state; then enable hardware display mirroring and confirm the panel is absent over ordinary apps while the menu bar exposes the current state, and disable mirroring to confirm live geometry recovery"
