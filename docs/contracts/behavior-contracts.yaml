  - id: ACTIVITY-STATE-005
    title: Subagent rollouts do not affect notch activity or conversation history
    status: superseded
    statement: >-
      A rollout whose session metadata identifies a child through
      `source.subagent.thread_spawn` or a non-empty `parent_thread_id` is
      ignored for notch activity and recent-conversation history. Its
      task_started, task_complete, and turn_aborted events cannot create active
      or completed records. Top-level rollouts retain the interrupted-turn
      supersession rules and the six-hour stale fallback from ACTIVITY-STATE-004;
      explicit terminal events still clear the matching top-level turn
      immediately.
    rationale: >-
      Codex writes child-agent work as separate rollout files beside the user's
      top-level task. Treating those files as user-facing conversations makes
      the notch show internal implementation work and lets an abandoned child
      turn keep the parent-facing running cue alive until stale cleanup.
    source: user-reported-incident
    owner: project-maintainer
    risk: medium
    scope:
      include: [compact-state, expanded-state, recent-conversations, rollout-session-monitoring]
      exclude: [task-termination, quota-semantics, physical-notch-geometry]
    examples:
      positive: "A child rollout with a task_started event and no terminal event contributes neither an active row nor a running count; a completed child rollout is absent from recent conversations; a direct `source: vscode` rollout remains eligible."
      negative: "A child-agent nickname appears in the expanded list, a child-only orphan keeps the compact notch in the running state, or decoding a direct string source causes the top-level rollout to disappear."
    guards:
      - Tests/CodexNotchTests/RolloutEventParserTests.swift
      - Tests/CodexNotchTests/ActiveSessionStoreTests.swift
      - "manual: run a top-level task with a child agent, close the child unexpectedly, and confirm only the top-level task controls the notch state"
    supersedes: [ACTIVITY-STATE-004]
