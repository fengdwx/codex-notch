  - id: QUOTA-SEMANTICS-043
    title: Physical-notch five-hour quota and running marquee use visible-only layer-backed motion at eight frames per second
    status: superseded
    statement: >-
      On the physical-notch layout, the compact left lane shows the returned five-hour quota's remaining percentage and no adjacent Codex status mark; when the API omits the five-hour rolling window, that lane stays empty. The compact right side continues to prioritize the weekly quota's remaining percentage. The separate no-notch floating-bar layout keeps its existing status lane. A returned five-hour rolling window (`limit_window_seconds=18000`) appears in the expanded quota section as the first quota row, above weekly, with its own remaining percentage, readable progress bar, exact reset timestamp, and second-level countdown. The weekly compact number stays readable at 9.5pt inside a 22pt ring or wave ball; the ring gap starts at 12 o'clock and progresses clockwise. The compact ring stroke remains 2.25pt and the wave-ball edge remains 1.75pt. Remaining quota above 20% is green, above 10% and up to 20% is yellow, and 10% or less is deep red; hue does not change continuously with the percentage. While a task is running, app animations are enabled, Reduce Motion is disabled, and the visible physical-notch compact surface is present, the quota indicator uses a gently flowing monochrome light-to-dark conic gradient for its current tier without a white highlight, and a single blue comet-like marquee runs on the compact island's outside contour: a small bright core leads a very short, progressively softer tail and a restrained halo, without a continuously lit full outline. Core Animation owns the ring gradient and marquee layers at a preferred 8 frames per second; the ring completes a cycle in 3 seconds and the marquee uses a 2.8-second loop. SwiftUI must not rebuild either persistent effect from a continuous TimelineView. Under the same conditions, the wave ball uses a precomputed repeated wave path and Core Animation translates it horizontally at a preferred 8 frames per second; its path is rebuilt only when geometry, liquid level, or color changes. When the surface is detached or no longer visible, the task stops, the card is expanded, app animations are disabled, or Reduce Motion is enabled, the corresponding layer animations are removed. Idle, completed, user-disabled-animation, and Reduce Motion states keep a full-brightness solid ring or still liquid level with no marquee, halo, or edge trace. Expanded quota, reset, and recent-conversation text retain their readable sizes and matching line heights. The full “N reset credits available” row remains clickable, and the card expands only downward to list each `rate-limit-reset-credits` item with `status=available`, its exact expiry time, and a second-level countdown without repeating the reset-credit name. The real notch in Settings remains the live preview, with no duplicate static preview card; the lower-right of the expanded panel continues to provide a Settings entry.
    rationale: >-
      The user clarified that the physical-notch left Codex mark is unnecessary, while the returned five-hour number must remain visible there. Keeping weekly on the right preserves its existing primary lane; leaving the left lane empty when five-hour data is absent avoids inventing data. The expanded card puts the shorter-window signal first so the two quota rows match the requested priority. The no-notch floating bar remains a separate layout with its own status lane. The first preview's isolated short dash and diffuse halo did not read clearly enough, so the running cue was refined into a longer edge light, then moved to the outer contour at the user's request. The user found that full-edge version still unattractive, so the current cue is a short comet-like light with a bright core and progressively softer trailing layers; it removes the constantly lit outline while retaining the outer-contour path. The stroke is centered just inside the fixed panel boundary so its visible half reads as an outside-edge light without being clipped, and the panel frame and hit area remain unchanged. Physical-notch review found 4 FPS visibly rough while 8 FPS remained acceptable. Moving the persistent motion into Core Animation preserves that cadence without requiring SwiftUI to rebuild gradient stops, a sampled wave path, or marquee geometry eight times each second. Explicit visibility, state, and lifecycle gates prevent detached, expanded, or stopped surfaces from continuing animation work.
    source: user-confirmed-physical-notch-feedback-and-performance-investigation
    owner: project-maintainer
    risk: medium
    scope:
      include: [compact-state, quota-expanded-state, settings, quota-animation, five-hour-window, running-marquee]
      exclude: [cost-estimation, window-geometry, completion-animation]
    examples:
      positive: A response containing both windows keeps the five-hour remaining number in the physical-notch left compact lane without a neighboring Codex mark and the weekly remaining number in the right lane; the expanded card lists five-hour first and weekly second with independent reset details, while the visible running quota layers and tapered blue outer-edge comet move through Core Animation at the user-confirmed 8 FPS preference and stopped states remain bright and readable.
      negative: Restoring the physical-notch left Codex mark, hiding the returned five-hour number there, rendering a five-hour indicator when that window is absent, hiding a returned five-hour row from the expanded card, placing weekly on the left or above five-hour, removing the no-notch floating-bar status lane, restoring the 4 FPS cadence, driving the persistent effect with a SwiftUI TimelineView, rebuilding the wave path or marquee geometry every visual frame, changing warning thresholds or indicator geometry, leaving a layer animation running after the surface disappears or the card expands, or continuing motion while idle, completed, Reduce Motion is enabled, or app animations are disabled.
    guards:
      - Tests/CodexNotchTests/QuotaDisplayStyleTests.swift
      - Tests/CodexNotchTests/NotchTextTests.swift
      - Tests/CodexNotchTests/NotchGeometryTests.swift
      - Tests/CodexNotchTests/CompactLeftIndicatorPolicyTests.swift
      - Tests/CodexNotchTests/NotchMarqueeMotionTests.swift
      - Tests/CodexNotchTests/CodexUsageClientTests.swift
      - Tests/CodexNotchTests/UsageWindowClassifierTests.swift
      - docs/decisions/010-layer-backed-quota-motion.md
      - docs/decisions/018-running-notch-marquee.md
      - "manual: on a physical notch with both windows returned, confirm the left lane shows only 5h, the right lane shows weekly, the expanded card puts 5h above weekly, and the running marquee stops when the card expands or motion is disabled"
    supersedes: [QUOTA-SEMANTICS-014]
    superseded_by: QUOTA-SEMANTICS-044
    last_verified_commit: null

  - id: QUOTA-SEMANTICS-044
    title: Physical-notch five-hour quota and low-cadence temporal-trail marquee use visible-only layer-backed motion
    status: superseded
    statement: >-
      On the physical-notch layout, the compact left lane shows the returned five-hour quota's remaining percentage and no adjacent Codex status mark; when the API omits the five-hour rolling window, that lane stays empty. The compact right side continues to prioritize the weekly quota's remaining percentage. The separate no-notch floating-bar layout keeps its existing status lane. A returned five-hour rolling window (`limit_window_seconds=18000`) appears in the expanded quota section as the first quota row, above weekly, with its own remaining percentage, readable progress bar, exact reset timestamp, and second-level countdown. The weekly compact number stays readable at 9.5pt inside a 22pt ring or wave ball; the ring gap starts at 12 o'clock and progresses clockwise. The compact ring stroke remains 2.25pt and the wave-ball edge remains 1.75pt. Remaining quota above 20% is green, above 10% and up to 20% is yellow, and 10% or less is deep red; hue does not change continuously with the percentage. While a task is running, app animations are enabled, Reduce Motion is disabled, and the visible physical-notch compact surface is present, the quota indicator uses a gently flowing monochrome light-to-dark conic gradient for its current tier without a white highlight. The running cue uses a single blue short-core marquee on the compact island's outside contour without a continuously lit full outline. Core Animation owns the ring gradient, wave path, and marquee at the existing preferred 8 frames per second. To prevent the low-cadence marquee from reading as discrete jumps, its bright core is rendered through a `CAReplicatorLayer` with delayed, progressively fading temporal copies; SwiftUI must not rebuild the persistent effects from a continuous `TimelineView`. The ring completes a cycle in 3 seconds, the marquee uses a 2.8-second loop, and the wave ball uses its precomputed repeated wave path. When the surface is detached or no longer visible, the task stops, the card is expanded, app animations are disabled, or Reduce Motion is enabled, the corresponding layer animations are removed. Idle, completed, user-disabled-animation, and Reduce Motion states keep a full-brightness solid ring or still liquid level with no marquee, halo, or edge trace. Expanded quota, reset, and recent-conversation text retain their readable sizes and matching line heights. The full “N reset credits available” row remains clickable, and the card expands only downward to list each `rate-limit-reset-credits` item with `status=available`, its exact expiry time, and a second-level countdown without repeating the reset-credit name. The real notch in Settings remains the live preview, with no duplicate static preview card; the lower-right of the expanded panel continues to provide a Settings entry.
    rationale: >-
      The user reported that the 8 FPS marquee still looked visibly rough and explicitly rejected increasing its frame rate. The measured path is about 560pt over a 2.8-second loop, so a single 8 FPS dash can advance roughly 24pt between visible updates. A temporal trail keeps the source cadence and lifecycle gates unchanged while four delayed, lower-alpha copies overlap those phase positions, reducing the perceived jump without adding a timer, a SwiftUI redraw loop, or a continuously lit outline. The five-hour and weekly quota lanes, fixed canvas, expanded ordering, and no-notch fallback remain unchanged.
    source: user-confirmed-low-cadence-feedback-and-Core-Animation-investigation
    owner: project-maintainer
    risk: medium
    scope:
      include: [compact-state, quota-expanded-state, settings, quota-animation, five-hour-window, running-marquee]
      exclude: [cost-estimation, window-geometry, completion-animation]
