  - id: APP-UPDATE-001
    title: Settings can manually check the latest stable release without private data
    status: active
    statement: >-
      Settings must provide a manual update-check action that reads only the
      public GitHub latest-release metadata endpoint with an unauthenticated
      GET request, compares its normalized semantic version with the bundled
      app version, and shows one of three outcomes: the app is up to date, a
      newer stable release is available with a link to its release page, or the
      check failed. The check must not download, install, or alter the app and
      must not affect quota, task, or conversation state.
    rationale: Users need a direct way to learn whether a newer distributable exists, while CodexNotch must not add an updater, send login data to GitHub, or let an unavailable network change the notch runtime.
    source: user-request
    owner: project-maintainer
    risk: medium
    scope:
      include: [settings, update-check, public-network-metadata]
      exclude: [automatic-download, automatic-install, authentication, quota-fetching, task-monitoring]
