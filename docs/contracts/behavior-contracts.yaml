  - id: NOTCH-VISIBILITY-040
    title: The notch display is reversible and stays out of immersive full-screen content
    status: superseded
    statement: The expanded notch card and the notch context menu provide a persistent, clearly labeled and high-contrast notch-display switch, enabled by default, which applies immediately and shows whether the notch is currently shown or hidden. When enabled and CodexNotch is using a valid notch screen, moving keyboard focus from Codex or ChatGPT to another ordinary foreground application must not remove the compact or expanded notch panel. If AppKit completes its accessory-app deactivation after the workspace activation notification, the next main-loop turn reasserts the requested notch panel above normal application windows. When disabled, the visible surface and compact indicators must disappear, but a fully transparent hover sensor remains anchored to the physical notch; moving the pointer into that sensor reopens the expanded card even while the preference is off, so the same in-card switch can turn the notch back on. The system-wide ⌥⌘N hot key toggles the visibility state and the menu bar also provides a Show notch action. The panel explicitly opts out of native full-screen participation. When the frontmost application's layer-zero content window covers the complete notch display, CodexNotch must order out both the visible panel and the transparent hover sensor whether the application uses a native full-screen Space or a borderless game window; application activation, active-Space changes, and a low-frequency window-boundary check update this suppression, and leaving full screen automatically restores the previously requested notch mode. In automatic menu-bar fallback mode, no notch panel or hover sensor may reappear; the fallback status item remains the only surface.
    rationale: >-
      Feishu can make AppKit withdraw CodexNotch's nonactivating panel after its normal workspace activation callback already rendered it. The process remains alive and Feishu uses an ordinary window layer, so the correct fix is a generic post-deactivation panel-order guard rather than a Feishu-specific bundle-ID exception or a higher window level. Hiding the visible notch must not destroy the user's intuitive recovery location: a transparent notch-anchored sensor keeps the entry point discoverable without displaying quota or task data, and hovering it exposes the same card switch that restores the display. A registered system hot key and menu-bar action remain secondary recovery paths. Conversely, full-screen video, presentation, and game content is intentionally immersive. Native Space flags do not identify borderless games, so the runtime also needs a privacy-preserving geometric check that reads only frontmost window ownership, layer, and bounds and never captures or logs screen content.
    source: user-reported-incidents-and-local-reproduction
    owner: project-maintainer
    risk: medium
    scope:
      include: [notch-window, compact-state, expanded-state, settings, application-activation, full-screen-spaces, borderless-full-screen-games]
      exclude: [menu-bar-fallback-content, quota-semantics, activity-state-machine, window-level]
    examples:
      positive: With the notch enabled, switching from Codex to Feishu leaves it visible and switching to any other ordinary desktop application follows the same rule without recognizing that application's bundle identifier; the expanded card exposes a prominent labeled switch with an obvious shown/hidden state, turning it off hides the visible surface but leaves a transparent sensor at the physical notch, hovering that area reopens the card, and turning the same switch on restores the compact notch; ⌥⌘N and the menu bar remain available as secondary recovery paths; a browser in native full screen and a borderless full-screen game both remain completely uncovered, and leaving either mode restores the notch.
      negative: Hiding the enabled panel when Feishu becomes frontmost, destroying the notch hover sensor during ordinary desktop use so the card cannot be recovered from the user's expected location, exposing quota or task content while hidden and not hovered, adding a Feishu-only or game-bundle exception, hiding without an available recovery path, leaving the visible panel or transparent sensor over an entire-screen frontmost game window, raising the panel above system-level windows, or restoring a visible panel while full-screen suppression or the no-notch menu-bar fallback is active.
    guards:
      - Tests/CodexNotchTests/NotchPanelVisibilityPolicyTests.swift
      - Tests/CodexNotchTests/FrontmostFullScreenDetectorTests.swift
      - Tests/CodexNotchTests/NotchRuntimePreferencesTests.swift
      - Tests/CodexNotchTests/SmokeTests.swift
      - docs/decisions/007-suppress-notch-over-full-screen-content.md
      - "manual: confirm ordinary app switches retain the notch; then enter a native full-screen window and a borderless full-screen game on the notch display, confirm both the visible panel and hidden hover sensor stay absent, exit full screen and confirm the requested notch mode restores, and verify the automatic menu-bar fallback remains panel-free"
    supersedes: []
    superseded_by: NOTCH-VISIBILITY-042
    last_verified_commit: null

  - id: NOTCH-VISIBILITY-042
    title: The requested notch display remains available across full-screen applications
    status: superseded
    statement: The expanded notch card and the notch context menu provide a persistent, clearly labeled and high-contrast notch-display switch, enabled by default, which applies immediately and shows whether the notch is currently shown or hidden. When enabled and CodexNotch is using a valid notch screen, the compact or expanded notch panel remains available above ordinary applications, native full-screen Spaces, and borderless full-screen windows, including after the frontmost application changes. The panel joins all Spaces as a full-screen auxiliary window and must not be suppressed based on frontmost-window geometry. If AppKit completes its accessory-app deactivation after the workspace activation notification, the next main-loop turn reasserts the requested notch panel. When disabled, the visible surface and compact indicators disappear, but a fully transparent hover sensor remains anchored to the physical notch so hovering can reopen the expanded card and restore the display from the same in-card switch. The system-wide ⌥⌘N hot key and menu-bar Show notch action remain secondary recovery paths. In automatic menu-bar fallback mode, no notch panel or hover sensor may reappear.
    rationale: The notch is a persistent status surface, and users need quota and task state while working in full-screen applications such as Feishu and Edge. Treating every full-screen window as immersive content made the notch disappear from the workflows where it is still expected. Window Space participation and the existing application-switch reassertion are sufficient; polling frontmost window geometry adds complexity and overrides the user's explicit display preference.
    source: user-reported-current-regression
    owner: project-maintainer
    risk: medium
    scope:
      include: [notch-window, compact-state, expanded-state, settings, application-activation, full-screen-spaces, borderless-full-screen-applications]
      exclude: [menu-bar-fallback-content, quota-semantics, activity-state-machine, window-level]
    examples:
      positive: With the notch enabled, switching to a native full-screen Feishu or Edge Space keeps the compact notch visible and hover still opens the card; a borderless full-screen window also leaves the requested notch visible; turning the display switch off hides the visible surface while retaining the transparent physical-notch recovery sensor; automatic menu-bar fallback stays panel-free.
      negative: Declaring the panel fullScreenNone, ordering it out because a frontmost window covers the screen, polling window geometry to override the display preference, losing the notch after an ordinary or full-screen app switch, showing compact content after the user turns the display off, or restoring a panel in automatic menu-bar fallback mode.
    guards:
      - Tests/CodexNotchTests/NotchPanelVisibilityPolicyTests.swift
      - Tests/CodexNotchTests/FrontmostFullScreenDetectorTests.swift
      - Tests/CodexNotchTests/NotchRuntimePreferencesTests.swift
      - Tests/CodexNotchTests/SmokeTests.swift
      - docs/decisions/009-keep-notch-visible-across-full-screen-apps.md
      - "manual: on a physical-notch Mac, enter native full screen in Feishu and Edge and confirm the compact notch remains visible, hover expansion stays anchored downward, collapse reclaims the transparent canvas, the disabled-display hover sensor still recovers the card, and automatic menu-bar fallback remains panel-free"
    supersedes: [NOTCH-VISIBILITY-040]
    superseded_by: NOTCH-VISIBILITY-044
    last_verified_commit: null

  - id: NOTCH-VISIBILITY-044
    title: No-notch displays use a top-center floating status bar
    status: superseded
    statement: >-
      On any display whose NSScreen does not expose valid auxiliary top-left and
      top-right notch areas, CodexNotch must render its compact quota, running,
      and completed states in a non-activating floating bar centered at the top
      of the visible display, below the menu bar when one is present. Hovering
      the bar expands the same quota and recent-conversation card downward from
      that fixed top anchor; the outer panel must not resize frame by frame or
      expand upward. The floating bar keeps the existing task navigation, quota
      semantics, privacy boundary, full-screen Space participation, and panel
      z-order. It must use a rounded floating surface rather than pretending
      that a physical camera cutout exists, and it must not create a hidden
      notch hover sensor. Turning the display preference off hides the floating
      panel and leaves the menu-bar recovery action available. On a valid notch
      display, the physical-notch layout and hidden-notch recovery behavior
      remain unchanged.
    rationale: >-
      Mac mini, older Mac, and external-display users do not have NSScreen
      auxiliary areas, so the former menu-bar-only branch made the app's primary
      quota and task surface disappear. A top-center floating bar follows the
      established Dynamic Island interaction without inventing a camera opening,
      while retaining the menu bar only as an explicit disabled-display recovery
      path.
    source: user-request-and-vibe-island-reference
    owner: project-maintainer
    risk: medium
    scope:
      include: [non-notch-screens, external-displays, floating-bar, compact-state, expanded-state, full-screen-spaces]
      exclude: [physical-notch-geometry, menu-bar-fallback-content, quota-semantics, activity-state-machine]
    examples:
      positive: A Mac mini display with no auxiliary areas shows a compact centered floating bar below the menu bar, hover expands the existing card downward, and turning the display off removes the bar while retaining the menu-bar Show action.
