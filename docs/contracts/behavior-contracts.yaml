  - id: PRIVACY-BOUNDARY-005
    title: Local authentication and conversation content must not be persisted or exposed
    status: active
    statement: Authentication tokens are used only in process memory; they must not be written to the repository, app cache, or logs; user-message bodies must not be displayed or recorded; recent rows may use only Codex's short `threads.title` summary from a read-only local-state lookup; the no-notch fallback must not broaden content exposure.
    rationale: The app reads local ChatGPT/Codex login state and session logs, so minimizing exposure is a non-negotiable boundary.
    source: technical-constraint
    owner: project-maintainer
    risk: critical
    scope:
      include: [auth-reader, usage-client, rollout-monitor, thread-title-reader, logs, fallback-menu]
      exclude: [user-provided project names and thread identifiers needed for navigation]
    examples:
      positive: The Authorization header from a usage request does not enter logs; the expanded list shows only read-only Codex summary titles and project names.
      negative: Committing auth.json, printing a token, caching the complete usage response, querying `first_user_message`, or displaying a user-message body.
    guards:
      - Tests/CodexNotchTests/CodexAuthReaderTests.swift
      - Tests/CodexNotchTests/CodexThreadTitleReaderTests.swift
      - "manual: sensitive-diff and runtime-log review until a dedicated secret scanner exists"
    supersedes: []
    superseded_by: null
    last_verified_commit: 0d37196

  - id: PRIVACY-APP-BUNDLE-039
    title: The notch mark must not require access to another application bundle
    status: superseded
    statement: The ChatGPT-shaped notch mark must be compiled into CodexNotch and rendered without locating, opening, or reading the contents of ChatGPT.app, Codex.app, or any other application bundle. CodexNotch must not declare or rely on App Management permission merely to render its compact, running, or completed states; the 18pt mark, template tinting, completion checkmark, and task navigation behavior remain unchanged.
    rationale: Reading `chatgptTemplate` from ChatGPT.app caused macOS to register CodexNotch for App Management even though quota and task monitoring do not need authority over other applications. A decorative status mark does not justify that privacy permission or a runtime dependency on another app's private resource layout.
    source: user-reported-permission-and-requested-fix
    owner: project-maintainer
    risk: critical
    scope:
      include: [notch-mark, compact-state, running-state, completed-state, privacy-permissions, app-bundle]
      exclude: [quota-semantics, activity-state-machine, window-geometry, release-upload]
    examples:
      positive: CodexNotch renders the same tintable 18pt mark from data compiled into its own executable while App Management remains disabled.
      negative: Resolving ChatGPT.app with NSWorkspace, opening its bundle with Bundle(url:), reading chatgptTemplate from its Resources directory, or adding NSAppBundlesUsageDescription only to preserve the icon.
    guards:
      - Tests/CodexNotchTests/AppIconAssetTests.swift
      - scripts/verify_app.sh
      - "manual: launch with CodexNotch disabled or absent from App Management and inspect idle, running, and completed marks on a physical notch"
    supersedes: []
    superseded_by: PRIVACY-APP-BUNDLE-040
    last_verified_commit: null

