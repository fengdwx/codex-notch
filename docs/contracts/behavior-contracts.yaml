      - docs/decisions/020-running-notch-breathing-light.md
      - "manual: on a physical notch with both windows returned, confirm the left lane shows only 5h, the right lane shows weekly, the expanded card puts 5h above weekly, the centered light reads as a restrained breathing status cue, and the cue stops when the card expands or motion is disabled"
