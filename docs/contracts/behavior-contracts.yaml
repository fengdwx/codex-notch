      negative: Rendering a 32pt surface through a 30pt menu bar, left-aligning the variable-width title between otherwise symmetric indicators, coloring the full completed title green, placing indicators into the curved corner envelope, keeping the pixel battle, hiding a resolved task title, or changing the physical-notch layout.
