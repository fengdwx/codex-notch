      positive: Clicking Check for Updates sends only a public metadata GET, reports v0.1.11 as current when it matches the latest stable release, offers the GitHub release page when a newer tag exists, and leaves the notch state unchanged on failure.
      negative: Sending auth.json or an Authorization header to GitHub, treating a draft or prerelease as the stable update, downloading an archive automatically, or hiding quota/activity data after a network error.
    guards:
      - Tests/CodexNotchTests/AppUpdateCheckerTests.swift
      - "manual: open Settings, click Check for Updates, and verify the current release result and download link"
