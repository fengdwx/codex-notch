  - id: NOTCH-VISIBILITY-046
    title: No-notch displays use a menu-bar-height task status island
    status: superseded
    statement: >-
      On a display without valid auxiliary notch areas, CodexNotch renders a
      non-activating task status island centered against the physical screen
      top. When the menu bar reserves at least 24pt, the compact island height
      must not exceed that measured menu-bar height and is capped at 30pt; when
      the menu bar is auto-hidden, a 28pt fallback remains top-attached. The
      island uses a 212pt content-filled layout with 8pt outer safety insets:
      the left lane keeps the existing Codex idle, running, or completed mark,
      the middle lane shows one truncated line using the resolved task title
      with a localized state fallback, and the right lane keeps the weekly
      quota indicator. The two indicator centers are symmetric around the island
      center; the title is optically centered in the middle lane with equal
      visual gaps and remains neutral white in running and completed states, so
      completion green is limited to the status check and quota. No warrior,
      slime, pixel battle, or related TimelineView is rendered. Content must
      remain inside the lower-corner envelope rather than touching or crossing
      its curved boundary. Hover expansion grows only
      downward from the same top edge, reserves the measured compact height
      before detail content, and reclaims the transparent canvas after collapse.
      Display-off recovery stays in the menu bar. Valid physical-notch geometry,
      camera-safe indicators, hidden-notch recovery, quota semantics, task
      navigation, privacy boundaries, full-screen Space participation, and panel
      z-order remain unchanged.
    rationale: >-
      Real-machine review rejected the pixel battle as visually crude and showed
      that filling a rectangular width ignored the narrower usable envelope near
      the island's lower corners. A Vibe Island-style status row makes the center
      useful with real task information, while measured height and explicit
      outer insets prevent the no-notch surface from crossing the menu-bar or
      corner boundaries.
