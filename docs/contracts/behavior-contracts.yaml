  - id: ACTIVITY-STATE-004
    title: Interrupted turns cannot leave the compact notch running
    status: superseded
    statement: A rollout records serial turns for one Codex thread. If a later task_started event appears for that thread before an earlier turn has a terminal event, the earlier turn is superseded and must no longer count as active or keep the compact quota indicator moving. A terminal event explicitly naming a superseded or unknown turn is ignored and must not finish the replacement turn. Active turns from separate rollout files retain their normal priority; when no active task remains, the most recent completion still shows the completion checkmark.
    rationale: A missing terminal event previously left an orphan active turn in a continuously modified rollout file. Because active staleness used the file modification time, the orphan could hold the compact notch in its running animation for hours after the visible task completed.
    source: user-reported-incident
    owner: project-maintainer
    risk: medium
    scope:
      include: [compact-state, rollout-session-monitoring]
      exclude: [task-termination, quota-warning-colors, physical-notch-geometry]
    examples:
      positive: An unfinished turn A followed by a started and completed turn B leaves no active session, so the compact notch uses the completion checkmark and the quota indicator is still.
      negative: An unmatched task_started remains active until the six-hour rollout stale timeout after another turn in the same rollout completes, or a late terminal event for A incorrectly ends B.
    guards:
      - Tests/CodexNotchTests/ActiveSessionStoreTests.swift
