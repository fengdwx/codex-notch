  - id: QUOTA-SEMANTICS-045
    title: Physical-notch five-hour quota and centered breathing running light use visible-only layer-backed motion
    status: superseded
    statement: >-
      On the physical-notch layout, the compact left lane shows the returned five-hour quota's remaining percentage and no adjacent Codex status mark; when the API omits the five-hour rolling window, that lane stays empty. The compact right side continues to show the weekly quota's remaining percentage, and the no-notch floating-bar layout keeps its separate status lane. A returned five-hour rolling window (`limit_window_seconds=18000`) remains the first quota row in the expanded card, above weekly, with its own remaining percentage, readable progress bar, exact reset timestamp, and second-level countdown. The weekly compact number stays readable at 9.5pt inside a 22pt ring or wave ball; existing ring geometry, warning bands, reset-credit rows, recent-conversation rows, downward-only expansion, and fixed-canvas behavior remain unchanged. While a task is running, app animations are enabled, Reduce Motion is disabled, and the visible physical-notch compact surface is present, Core Animation owns the quota ring, wave path, and running cue at the existing preferred 8 frames per second. The running cue is a single small blue light centered in the black compact notch surface; it uses a slow ease-in-ease-out breathing cycle that changes only opacity, scale, and soft halo, without x/y translation, marquee travel, a full bright outline, or SwiftUI's continuous `TimelineView`. When the surface is detached or no longer visible, the task stops, the card is expanded, app animations are disabled, or Reduce Motion is enabled, the corresponding layer animations are removed. Idle, completed, user-disabled-animation, and Reduce Motion states keep a readable static surface with no running light. The real notch in Settings remains the live preview, with no duplicate static preview card; the lower-right of the expanded panel continues to provide a Settings entry.
    rationale: >-
      The user rejected increasing the animation frame rate and then clarified that the replacement need not be a marquee. Apple Human Interface Guidelines recommend purposeful, unobtrusive motion and replacing spatial movement with fades when motion should be reduced. Apple's SF Symbols guidance describes a Breathe animation as changing presence and size to signal ongoing activity. A small centered pulse keeps the running state visible while eliminating the long spatial jump that made the outer-edge marquee look rough at 8 FPS. Core Animation interpolates scalar opacity, scale, and shadow properties on the layer; the compact layout, quota data, lifecycle gates, and frame-rate budget remain unchanged.
    source: user-confirmed-breathing-light-preview-and-Apple-motion-research
    owner: project-maintainer
    risk: medium
    scope:
      include: [compact-state, quota-expanded-state, settings, quota-animation, five-hour-window, running-pulse]
      exclude: [cost-estimation, window-geometry, completion-animation, no-notch-running-cue]
    examples:
      positive: A response containing both windows keeps five-hour on the physical-notch left and weekly on the right, lists five-hour first when expanded, and shows one small centered blue light breathing softly while a task runs; the ring, wave, and pulse stop when the surface expands or motion is disabled.
      negative: Raising the frame-rate budget, moving a bright point around the edge, restoring the Codex mark in the physical-notch left lane, showing a returned five-hour window nowhere, using a full bright outline, running a SwiftUI TimelineView for the cue, or leaving the pulse active while idle, completed, expanded, hidden, or reduced-motion.
