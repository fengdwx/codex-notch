  - id: NOTCH-VISIBILITY-045
    title: No-notch displays use a top-attached compact activity island
    status: superseded
    statement: >-
      On a display without valid auxiliary notch areas, CodexNotch renders a
      compact non-activating activity island centered against the physical top
      edge of the screen, including the menu-bar region, with no vertical gap.
      The no-notch compact width is independent of the physical camera-gap
      minimum and its center is filled by a small original pixel battle scene:
      idle shows a stable warrior and slime face-off, running shows an 8 FPS
      four-frame sword-and-slime loop only while app motion is allowed, and
      completed shows a stable victory frame with the slime gone. Reduce Motion
      or disabled app animations keep a static readable frame and must not leave
      a TimelineView running. The left Codex state mark and right weekly quota
      remain visible and clickable around the scene. Hover expansion stays
      attached to the same top edge, grows only downward, reserves the compact
      attachment height before detail content, and reclaims its transparent
      canvas after collapse. Disabling this no-notch island removes the panel
      and retains the menu-bar recovery action. Valid physical-notch geometry,
      camera-safe indicators, hidden-notch hover recovery, quota semantics,
      task navigation, privacy boundaries, full-screen Space participation, and
      panel z-order remain unchanged.
    rationale: >-
      The first fallback reused the 257pt physical-notch camera gap and placed
      it below the menu bar plus an extra gap, producing an oversized empty bar
      detached from the top edge. A dedicated compact width, top attachment,
      and state-driven center scene provide useful status density in the visual
      language demonstrated by Vibe Island without copying its assets.
